appId: com.alessiobertollo.scopone
name: Avvio di una nuova partita
tags:
  - smoke
---
- launchApp:
    clearState: true

# Niente asserzioni sul testo: lingua e mazzo li sceglie l'utente, e i
# titoli cambiano di conseguenza. Gli identificatori no.
- assertVisible:
    id: 'nuova-partita'
# A installazione pulita non c'è nulla da riprendere.
- assertNotVisible:
    id: 'riprendi-partita'

# La creazione partita non è più la schermata di avvio: si passa dalla home.
- tapOn:
    id: 'nuova-partita'

- tapOn:
    id: 'nome-squadra-a'
- eraseText
- inputText: 'Rossi'

- tapOn:
    id: 'nome-squadra-b'
- eraseText
- inputText: 'Bianchi'

- hideKeyboard

- tapOn:
    id: 'traguardo-11'
- tapOn:
    id: 'inizia-partita'

# Tabellone vuoto: nessuna riga di mano.
- assertNotVisible:
    id: 'mano-0'
- assertVisible:
    id: 'totale-A'
    text: '0'
- assertVisible:
    id: 'totale-B'
    text: '0'
