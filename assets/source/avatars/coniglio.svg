<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Sagoma monocroma: il colore lo mette l'app con tintColor, per
       seguire il tema chiaro o scuro. Non aggiungere colori qui. -->
  <mask id="m">
    <rect width="64" height="64" fill="#fff"/>
    <circle cx="26" cy="41" r="2.5" fill="#000"/><circle cx="38" cy="41" r="2.5" fill="#000"/>
  </mask>
  <g fill="#000" mask="url(#m)">
    <ellipse cx="25" cy="21" rx="5" ry="15"/><ellipse cx="39" cy="21" rx="5" ry="15"/><circle cx="32" cy="43" r="15"/>
  </g>
</svg>
