name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      # Intercetta dipendenze native disallineate o peer mancanti: sono
      # problemi che non emergono dai test perché rompono solo la build vera.
      #
      # Non blocca di proposito. Il controllo sulle versioni confronta con
      # quelle che l'SDK si aspetta *oggi*, ed Expo pubblica patch di continuo:
      # come cancello farebbe fallire main nei giorni in cui nessuno ha toccato
      # il codice. Un allarme che suona da solo viene ignorato, e allora tanto
      # vale che non fermi la coda. L'elenco resta visibile nei log, e
      # l'allineamento si fa prima di una build — che è quando conta.
      - name: Expo doctor
        run: npm run doctor
        continue-on-error: true
